<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordSteps - Progress: Easy Level</title>
<style>
:root{--orange:#ff7417;--green:#579b21;--lime:#a8cf69;--cream:#fff8eb;--ink:#263238;--pale:#edf5df;--muted:#78816e}
*{box-sizing:border-box}body{margin:0;background:#fff0d8;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}.shell{width:min(100%,480px);min-height:100vh;margin:auto;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 0 30px #7a552322;padding:18px 18px 30px}
.content{position:relative;z-index:1}.brand{text-align:center;color:var(--orange);font-size:30px;font-weight:900;letter-spacing:-1px;margin:14px 0 4px}.brand span{color:var(--green)}.tag{text-align:center;color:var(--green);font-weight:700;font-size:13px}.mascot{font-size:92px;text-align:center;margin:25px 0 5px}h1,h2{text-align:center;color:var(--green);margin:10px 0}h1{font-size:27px}h2{font-size:23px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 20px}
.btn{background:var(--orange);color:white;padding:13px 20px;border-radius:28px;font-weight:800;display:block;width:100%;margin:12px auto;max-width:310px;box-shadow:0 4px 0 #d65c10}.btn.green{background:var(--green);box-shadow:0 4px 0 #397416}.btn.light{background:white;color:var(--green);box-shadow:0 3px 0 #d7e4c7;border:1px solid #e1ebd4}
.top{display:flex;justify-content:space-between;align-items:center;background:var(--orange);color:white;border-radius:18px;padding:12px 14px;font-weight:800;margin:14px 0}.back{background:transparent;color:inherit;font-size:21px;padding:0 6px}.level{background:#ff7417;color:white;border-radius:24px;padding:20px;width:100%;font-size:20px;font-weight:900;text-align:left;box-shadow:0 4px 0 #d65c10;margin:18px 0}.stepgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.step{border-radius:16px;padding:15px 10px;background:#fff;border:2px solid #e4edda;color:var(--green);font-weight:800;text-align:left}.step.open{background:#fff0d8;border-color:#ffc18e}.step small{float:right}.card{background:white;border-radius:24px;padding:20px 16px;margin:18px 0;box-shadow:0 5px 18px #9d86501c;text-align:center}.picture{height:150px;border-radius:20px;background:#fff3df;display:grid;place-items:center;font-size:86px;margin:12px 0}.word{font-size:28px;color:var(--green);font-weight:900}.meaning{background:var(--pale);padding:10px;border-radius:12px;margin:12px 0;color:#477c20}.footer{text-align:center;color:var(--green);font-size:12px;margin-top:24px;font-weight:800}.note{background:#edf5df;border-radius:16px;padding:13px;color:#477c20;font-size:13px;line-height:1.5;margin-top:18px}
@media(min-width:700px){body{padding:24px 0}.shell{min-height:850px;border-radius:32px}}
</style></head>
<body><main class="shell"><div class="content" id="app"></div></main>
<script>
const words=[['Apple','apel','🍎'],['Book','buku','📘'],['Chair','kursi','🪑'],['Pencil','pensil','✏️'],['Table','meja','🪵'],['Door','pintu','🚪'],['Window','jendela','🪟'],['Bag','tas','🎒'],['Pen','pulpen','🖊️'],['Eraser','penghapus','🧽']];
let page='welcome';const app=document.getElementById('app');
function go(p){page=p;render()}function header(t,back){return `<div class="top"><button class="back" onclick="go('${back}')">‹</button><span>${t}</span><span>🦊</span></div>`}
function render(){
 if(page==='welcome')app.innerHTML=`<div class="brand">Word<span>Steps</span></div><div class="tag">English Vocabulary Learning Application</div><div class="mascot">🦊📖</div><h1>Welcome to WordSteps!</h1><p class="sub">Learn English one small step at a time.</p><button class="btn" onclick="go('menu')">Get Started　➜</button><div class="footer">Small Steps, Big Progress</div>`;
 if(page==='menu')app.innerHTML=`${header('Main Menu','welcome')}<h1>Welcome, Learner!</h1><p class="sub">Choose a level to start learning English vocabulary.</p><button class="level" onclick="go('easy')">⭐　Easy Level <span style="float:right">›</span><small style="display:block;font-size:12px;font-weight:500;margin:7px 0 0">Basic vocabulary about everyday objects</small></button><div class="note"><b>Development progress:</b> The current prototype focuses on the Easy Level. Medium and Hard levels will be developed in the next stages.</div>`;
 if(page==='easy')app.innerHTML=`${header('Choose Level','menu')}<h1>Easy Level</h1><p class="sub">Learn basic English vocabulary about everyday objects.</p><div class="card"><div class="mascot" style="font-size:64px;margin:5px">🦊📚</div><b>10 Learning Steps</b><p class="sub">Start from Step 1 and continue step by step.</p></div><button class="btn green" onclick="go('steps')">View Easy Steps　➜</button>`;
 if(page==='steps')app.innerHTML=`${header('Easy Level Steps','easy')}<h1>Easy Level</h1><p class="sub">Select a step to preview its vocabulary material.</p><div class="stepgrid">${Array.from({length:10},(_,i)=>`<button class="step ${i===0?'open':''}" onclick="openStep(${i})">${i===0?'★':'🔒'}　Step ${i+1}<small>${i===0?'➜':'Soon'}</small></button>`).join('')}</div><div class="note">For this progress version, Step 1 is available as a preview. The other steps will be developed gradually.</div>`;
 if(page==='lesson')app.innerHTML=`${header('Step 1 - Vocabulary','steps')}<h2>Step 1: Everyday Objects</h2><p class="sub">Look at the picture, read the English word, and learn its meaning.</p>${words.map(w=>`<div class="card"><div class="picture">${w[2]}</div><div class="word">${w[0]}</div><div class="meaning"><b>Indonesian meaning:</b> ${w[1]}</div><div style="color:#78816e;font-size:13px">Spelling: ${w[0].split('').join(' - ')}</div></div>`).join('')}<button class="btn green" onclick="go('steps')">Back to Easy Steps</button>`;
}
function openStep(i){if(i===0)go('lesson');else alert('This step will be developed in the next progress update.');}
render();
</script></body></html>
